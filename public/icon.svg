<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="4" />

  <!-- Screen Frame Mockup -->
  <rect x="80" y="90" width="352" height="230" rx="20" fill="#030712" stroke="#4338ca" stroke-width="6" />
  
  <!-- Screen Stand -->
  <path d="M226 320 L286 320 L306 390 L206 390 Z" fill="#312e81" />
  <rect x="180" y="388" width="152" height="18" rx="9" fill="#4338ca" />

  <!-- Glowing Worship Cross in Screen -->
  <g filter="url(#glow)">
    <!-- Vertical Beam -->
    <rect x="242" y="125" width="28" height="160" rx="6" fill="url(#goldGrad)" />
    <!-- Horizontal Beam -->
    <rect x="202" y="165" width="108" height="26" rx="6" fill="url(#goldGrad)" />
  </g>

  <!-- Soundwave / Lyrics indicator lines -->
  <rect x="130" y="432" width="60" height="12" rx="6" fill="#38bdf8" opacity="0.8" />
  <rect x="202" y="432" width="108" height="12" rx="6" fill="#818cf8" opacity="0.9" />
  <rect x="322" y="432" width="60" height="12" rx="6" fill="#38bdf8" opacity="0.8" />
</svg>
